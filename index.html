<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Robo Tutor</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600;700&family=Rubik+Dirt&display=swap" rel="stylesheet">
<style>
:root{--bg:#daf1de;--dk:#013e37;--fg:#daf1de;--ln:#8fc36f;--tx:#013e37;--sf:#013e37}
body.dark{--bg:#0c1f1b;--dk:#0d5247;--fg:#e4f5e8;--tx:#e4f5e8}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:22px 'Saira Condensed',sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top,0)}
#app{max-width:800px;margin:0 auto;padding:16px 22px 50px;position:relative}
h1{font-weight:600;font-size:58px;margin:0;line-height:.88;text-align:center}
.pill{background:var(--dk);color:var(--fg);border-radius:50%/60%;padding:28px 60px;margin:0 auto 24px;width:max-content;max-width:90%}
.bar{background:var(--dk);color:var(--fg);padding:8px;margin:6px 0 30px}
.card{background:var(--dk);color:var(--fg);padding:26px 30px;border-radius:28px;position:relative}.sq{border-radius:0}
label{display:block;margin:12px 0 4px}
.in{width:100%;max-width:280px;background:var(--fg);color:var(--dk);border:0;border-radius:14px;padding:6px 14px;font:inherit;display:block}
.dk{background:var(--dk);color:var(--fg);border:0;border-radius:14px;padding:10px 14px;font:inherit;width:100%;max-width:340px;display:block}
.dk.edit{background:var(--fg);color:var(--dk);outline:3px solid var(--ln)}
.btn{display:block;margin:18px auto 0;min-width:min(420px,100%);font:600 36px 'Saira Condensed';background:var(--fg);color:var(--dk);border:3px solid var(--ln);border-radius:40px;padding:0 30px;cursor:pointer}
.btn.d{background:var(--dk);color:var(--fg)}.btn.red{background:#d32b2b;color:#fff;border:0;min-width:min(360px,100%);margin-top:16px}
.chip{display:inline-block;background:var(--dk);color:var(--fg);border:0;border-radius:14px;padding:2px 24px;margin:5px 10px 5px 0;font:inherit;cursor:pointer;opacity:.55}
.chip.on{opacity:1;outline:3px solid var(--ln)}
.lnk{cursor:pointer}.ul{text-decoration:underline;cursor:pointer}
.err{min-height:26px;font-size:19px;text-align:center;color:#ffb4b4;margin-top:8px}.out .err{color:#c62828}.card .err{color:#ffb4b4}
.fr{display:block;margin:0 auto -6px;position:relative;z-index:2}
.ttl{font-family:'Rubik Dirt',cursive;font-size:70px;text-align:center;line-height:1;margin:6px 0 0}
.wv{position:relative;width:230px;margin:0 auto -6px;z-index:2}.wv img{width:100%;display:block}
.wv .h{position:absolute;left:0;top:0;clip-path:polygon(0 53.15%,17.06% 53.15%,17.06% 76.92%,0 102.1%);transform-origin:14.22% 78.32%;animation:w .5s ease-in-out infinite alternate}.wv .b{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 95.1%,17.06% 69.93%,17.06% 53.15%,0 53.15%)}@keyframes w{from{transform:rotate(10deg)}to{transform:rotate(-10deg)}}
.bl{position:relative;margin:0 auto -6px;z-index:2;width:215px}.bl img{width:100%;display:block}
.bl i{position:absolute;top:13%;width:29%;height:31%;border-radius:50%;background:#9fca7c;transform-origin:top;transform:scaleY(0);animation:bk 3.4s infinite}
.bl i:nth-of-type(1){left:9%}.bl i:nth-of-type(2){right:9%}@keyframes bk{0%,90%,100%{transform:scaleY(0)}94%,97%{transform:scaleY(1)}}
.th{animation:th 3.8s ease-in-out infinite;transform-origin:50% 95%}@keyframes th{0%,100%{transform:rotate(0)}30%{transform:rotate(-5deg) translateY(-4px)}65%{transform:rotate(4deg)}}
.home{display:grid;grid-template-columns:1fr 1fr;gap:76px 30px;position:relative;margin-top:50px}
.home .card{cursor:pointer;min-height:200px;border-radius:0;display:flex;align-items:center;gap:14px;padding:16px}
.home .card img{width:88px}.home h2{margin:0;font-size:46px;font-weight:600;line-height:1}.home small{font-size:17px}
.home .fr{position:absolute;left:50%;top:50%;width:215px;margin:-150px 0 0 -107px;z-index:3;pointer-events:none}
.gear{position:absolute;right:20px;top:12px;font-size:32px;cursor:pointer;background:none;border:0;color:var(--tx)}
.back{background:none;border:0;font:inherit;color:var(--tx);cursor:pointer;text-decoration:underline;padding:0}
.top{position:relative}.top .fr{position:absolute;margin:0}
.books{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 20px;text-align:center}
.bk img,.ph{width:120px;height:154px;object-fit:cover;display:block;margin:0 auto 10px}
.ph{background:linear-gradient(135deg,#e0a95c,#c8553d);color:#fff;display:flex;align-items:center;justify-content:center;padding:6px}
.tag{background:var(--dk);color:var(--fg);padding:1px 8px 1px 14px;display:inline-flex;gap:10px;align-items:center;justify-content:space-between;min-width:140px}
.tag button{background:none;border:2px solid var(--fg);color:var(--fg);border-radius:50%;width:26px;height:26px;line-height:16px;font:inherit;cursor:pointer;padding:0}
.tag.on button{background:var(--ln);color:var(--dk);border-color:var(--ln)}
.rev{display:grid;grid-template-columns:auto 120px;gap:14px 26px;align-items:center;justify-content:start}
.rev .l{background:var(--dk);color:var(--fg);border-radius:14px;padding:2px 16px;font-size:27px}
.rev button{background:var(--dk);color:var(--fg);border:3px solid var(--ln);border-radius:30px;font:inherit;padding:2px 10px;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.hist{background:var(--dk);color:var(--fg);padding:24px 28px;margin-bottom:22px;display:flex;justify-content:space-between;gap:12px;font-size:25px}
.sw{display:flex;justify-content:space-between;align-items:center;font-size:33px;font-weight:600;margin:14px 0 14px 40px}
.tg{width:82px;height:42px;border-radius:30px;background:#9aa;position:relative;cursor:pointer;border:0}.tg.on{background:#3b8f3f}
.tg:after{content:"";position:absolute;top:4px;left:4px;width:34px;height:34px;border-radius:50%;background:var(--fg);transition:.2s}.tg.on:after{left:44px}
table{border-collapse:collapse;width:100%;margin-top:18px}td,th{background:var(--dk);color:var(--fg);padding:6px 14px;border:2px solid var(--bg);text-align:left}
.ok{text-align:center}.ok .ic{font-size:80px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--dk);color:var(--fg);padding:10px 26px;border-radius:30px;z-index:9}
@media(max-width:560px){h1{font-size:42px}.home{gap:70px 12px}.home h2{font-size:30px}.home .card{flex-direction:column;text-align:center;min-height:170px}.books{gap:16px 8px}.bk img,.ph{width:96px;height:124px}.tag{min-width:100px;font-size:18px}.hist{font-size:18px;padding:16px}.top .fr{width:110px!important}.pill{padding:20px 34px}}
</style>
</head>

    { id: 5, title: 'Coding Basics', tag: 'Beginner', on: true },
    { id: 6, title: 'Art & Craft', tag: 'Grade 2', on: false }
  ]
};

function setView(v) {
  state.view = v;
  render();
  window.scrollTo(0,0);
}

function toggleDark() {
  state.dark = !state.dark;
  DB.set('dark', state.dark);
  render();
}

function toggleTag(id) {
  const b = state.books.find(x => x.id === id);
  if (b) {
    b.on = !b.on;
    render();
  }
}

function handleLogin() {
  const u = document.getElementById('u_name').value.trim();
  const p = document.getElementById('u_pass').value.trim();
  const err = document.getElementById('err_msg');
  if (!u || !p) {
    err.innerText = 'Please enter both username and password';
    return;
  }
  state.user = { name: u };
  DB.set('user', state.user);
  setView('home');
}

function handleRegister() {
  const u = document.getElementById('r_name').value.trim();
  const p = document.getElementById('r_pass').value.trim();
  const err = document.getElementById('err_msg');
  if (!u || !p) {
    err.innerText = 'Please fill out all registration fields';
    return;
  }
  state.user = { name: u };
  DB.set('user', state.user);
  setView('home');
}

function handleLogout() {
  state.user = null;
  DB.set('user', null);
  setView('login');
}

function render() {
  const app = document.getElementById('app');
  document.body.className = state.dark ? 'dark' : '';

  if (state.view === 'login') {
    app.innerHTML = `
      <div class="ttl">ROBO TUTOR</div>
      <div class="wv">
        <img class="b" src="${IMG.login}" alt="Robo Tutor Mascot" />
        <img class="h" src="${IMG.login}" alt="Robo Tutor Hand" />
      </div>
      <div class="pill"><h1>WELCOME</h1></div>
      <div class="card" style="max-width:440px;margin:0 auto;">
        <label>Username</label>
        <input class="in" id="u_name" placeholder="Enter username" />
        <label>Password</label>
        <input class="in" id="u_pass" type="password" placeholder="Enter password" />
        <button class="btn" onclick="handleLogin()">LOGIN</button>
        <div class="err" id="err_msg"></div>
        <div style="text-align:center;margin-top:14px;">
          <span>Don't have an account? </span>
          <span class="ul" onclick="setView('register')">Register</span>
        </div>
      </div>
    `;
  } 
  else if (state.view === 'register') {
    app.innerHTML = `
      <div class="ttl">ROBO TUTOR</div>
      <div class="bl">
        <img src="${IMG.register}" alt="Robo Tutor Mascot" />
        <i></i><i></i>
      </div>
      <div class="pill"><h1>REGISTER</h1></div>
      <div class="card" style="max-width:440px;margin:0 auto;">
        <label>Choose Username</label>
        <input class="in" id="r_name" placeholder="Username" />
        <label>Password</label>
        <input class="in" id="r_pass" type="password" placeholder="Password" />
        <button class="btn" onclick="handleRegister()">CREATE ACCOUNT</button>
        <div class="err" id="err_msg"></div>
        <div style="text-align:center;margin-top:14px;">
          <span>Already registered? </span>
          <span class="ul" onclick="setView('login')">Login</span>
        </div>
      </div>
    `;
  }
  else if (state.view === 'home') {
    app.innerHTML = `
      <button class="gear" onclick="setView('settings')">⚙</button>
      <div class="ttl">ROBO TUTOR</div>
      <div class="bar" style="text-align:center;font-size:26px;">Welcome back, ${state.user?.name || 'Explorer'}!</div>
      
      <div class="home">
        <div class="bl fr th">
          <img src="${IMG.home}" alt="Robo Tutor Mascot" />
          <i></i><i></i>
        </div>
        <div class="card" onclick="setView('books')">
          <div>
            <h2>COURSES</h2>
            <small>Browse lesson books</small>
          </div>
        </div>
        <div class="card" onclick="setView('revision')">
          <div>
            <h2>REVISION</h2>
            <small>Practice exercises</small>
          </div>
        </div>
        <div class="card" onclick="setView('profile')">
          <div>
            <h2>PROFILE</h2>
            <small>Track study stats</small>
          </div>
        </div>
        <div class="card" onclick="handleLogout()">
          <div>
            <h2>LOGOUT</h2>
            <small>Exit to login</small>
          </div>
        </div>
      </div>
    `;
  }
  else if (state.view === 'books') {
    app.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <button class="back" onclick="setView('home')">&larr; Back to Dashboard</button>
        <div class="bl" style="width:110px;margin:0;">
          <img src="${IMG.books}" alt="Robo Tutor" />
          <i></i><i></i>
        </div>
      </div>
      <div class="pill"><h1>MY COURSES</h1></div>
      <div class="books">
        ${state.books.map(b => `
          <div class="bk">
            <div class="ph"><span>${b.title}</span></div>
            <div class="tag ${b.on ? 'on' : ''}">
              <span>${b.tag}</span>
              <button onclick="toggleTag(${b.id})">${b.on ? '✓' : '+'}</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }
  else if (state.view === 'revision') {
    app.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <button class="back" onclick="setView('home')">&larr; Back to Dashboard</button>
        <div class="wv" style="width:110px;margin:0;">
          <img class="b" src="${IMG.revision}" alt="Robo Tutor" />
          <img class="h" src="${IMG.revision}" alt="Robo Tutor" />
        </div>
      </div>
      <div class="pill"><h1>REVISION</h1></div>
      <div class="card">
        <div class="rev">
          <div class="l">Multiplication Drill (Table 1-12)</div>
          <button onclick="alert('Starting multiplication practice...')">START</button>
        </div>
        <div class="rev" style="margin-top:16px;">
          <div class="l">Chemical Elements & Symbols</div>
          <button onclick="alert('Starting science quiz...')">START</button>
        </div>
        <div class="rev" style="margin-top:16px;">
          <div class="l">Vocabulary & Spelldown</div>
          <button onclick="alert('Starting vocabulary quiz...')">START</button>
        </div>
      </div>
    `;
  }
  else if (state.view === 'profile') {
    app.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <button class="back" onclick="setView('home')">&larr; Back to Dashboard</button>
        <div class="bl" style="width:110px;margin:0;">
          <img src="${IMG.profile}" alt="Robo Tutor" />
          <i></i><i></i>
        </div>
      </div>
      <div class="pill"><h1>STUDENT PROFILE</h1></div>
      <div class="card">
        <div class="hist">
          <span>Student Name:</span>
          <b>${state.user?.name || 'Guest User'}</b>
        </div>
        <div class="hist">
          <span>Learning Level:</span>
          <b>Level 4 (Advanced)</b>
        </div>
        <div class="hist">
          <span>Completed Drills:</span>
          <b>28 Quizzes</b>
        </div>
        <div class="hist">
          <span>Accuracy Score:</span>
          <b>94.5%</b>
        </div>
      </div>
    `;
  }
  else if (state.view === 'settings') {
    app.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <button class="back" onclick="setView('home')">&larr; Back to Dashboard</button>
        <div class="bl" style="width:110px;margin:0;">
          <img src="${IMG.login}" alt="Robo Tutor" />
          <i></i><i></i>
        </div>
      </div>
      <div class="pill"><h1>SETTINGS</h1></div>
      <div class="card">
        <div class="sw">
          <span>Dark Mode</span>
          <button class="tg ${state.dark ? 'on' : ''}" onclick="toggleDark()"></button>
        </div>
        <hr style="border:0;border-top:2px solid var(--bg);margin:16px 0;" />
        <div style="text-align:center;">
          <button class="btn d" onclick="alert('Progress synchronized!')">SYNC PROGRESS</button>
          <button class="btn red" onclick="handleLogout()">LOGOUT</button>
        </div>
      </div>
    `;
  }
}

// Initial render
render();
</script>
</body>
</html>
